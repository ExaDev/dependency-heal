name: Sibling dependency instant update

# Reusable workflow for any ExaDev-adjacent repo with an npm dependency on an ExaDev-published sibling package. A caller repo's own thin stub triggers this on repository_dispatch (sent by a sibling package's own CI the moment it publishes -- see that package's "Notify downstream repositories" job), on push to main (to heal any sibling-update PR that fell behind), and on workflow_dispatch (manual trigger). A called reusable workflow receives the exact same github.event/github.event_name as its caller (GitHub Actions propagates the calling workflow's full event payload into workflow_call jobs), so github.event.client_payload and the event_name gates below behave identically to when this logic lived directly in each repo.
#
# This workflow originally lived in ExaDev/.github, shared across every repo in the documents.js ecosystem. That family has since been consolidated into a single monorepo (ExaDev/documents.js), which manages its own internal dependencies via pnpm workspace references and no longer needs this mechanism at all. It moved here, into its own repo (mirroring ExaDev/claude-code-action's pattern -- a single reusable component, versioned by a floating major tag, consumed by name from other repos), because its only remaining active consumer is a genuine cross-org caller, novus-power/hive.
#
# The branch push and the PR-open call both authenticate via a freshly-minted GitHub App installation token, not the default GITHUB_TOKEN -- GITHUB_TOKEN-authenticated actions (a push OR opening a PR) do not cascade into further workflow runs, so a GITHUB_TOKEN-created PR would never trigger the caller repo's own CI pull_request checks at all, leaving nothing for the merge step below to wait on.
#
# Even with the App token making that cascade happen for real, GitHub can take a few seconds to register the caller repo's CI check-runs against the new PR's commit at all. The "wait for CI checks" step first polls until at least one check-run has appeared against the head commit, and only then starts polling for every check-run to reach a conclusion -- skipping that first wait would read an empty check-run list as "nothing pending, nothing failed" and merge before CI ever ran.
#
# Both bump sites -- the dispatch handler and the heal path's regeneration -- are idempotent by version ordering, not by diff presence: pnpm add only runs when the named version is strictly above what the default branch already pins for the package (package.json's current spec across its dependency tables, range caret stripped -- the form pnpm add itself writes). A no-op guarded on diff presence catches only an exact replay; a named version below current main still diffs -- a downgrade diffs as readily as an upgrade -- and the PR it opens is a downgrade the wait-for-green gate will merge as happily as any upgrade. A caller with no declared dependency on the package at all -- an empty floor -- is treated identically to "at or below": there is nothing to bump, never an invitation to add a dependency the caller never declared. Without this, a caller repo dispatched a package it doesn't actually depend on would have `pnpm add` silently introduce it as brand new, since an empty floor previously fell straight through the ordering check.
#
# This workflow never pushes directly to main -- the PR only merges once the caller repo's own required checks genuinely pass on it, and (when branch protection is configured with required status checks) GitHub itself refuses the merge until they do, independent of this script's own polling logic being correct. Neither merge step below pre-judges the PR on every check-run's conclusion for exactly this reason: a caller can have optional, non-required check-runs (a review bot, a label sync) that fail for reasons having nothing to do with mergeability -- e.g. novus-power/hive's own Claude Review action refuses to run at all for a bot-authored PR unless the bot's login is in its allowed_bots list, which stranded every sibling-update PR open at once until that config caught up. Both steps below only wait for every check-run to stop being pending, then hand the actual accept/reject decision to `gh pr merge` itself, which GitHub backs with the real required-status-checks list -- the one source of truth for what's actually required, never duplicated or guessed at here.
#
# app-id defaults to the org-wide 'exadev' App a caller relies on via `secrets: inherit` (which passes AUTOMERGE_APP_PRIVATE_KEY through under that same name regardless of this input) -- passing a different app-id is for a caller authenticating as a different installed App instead (e.g. a cross-org caller where the org-wide App was never installed).
#
# app-private-key is the secret holding that App's private key, for a caller whose own secret for it isn't named AUTOMERGE_APP_PRIVATE_KEY -- a caller that leaves this unset keeps resolving via `secrets: inherit`, since the fallback below only takes effect when the caller passes this secret explicitly (inherit never populates a workflow_call secret under a name the caller doesn't itself have).
#
# workspace switches the bump mechanism from `pnpm add` against a single root package.json (a standalone repo, one package.json at the root) to `pnpm update --recursive` against every package.json in the tree (a caller that is itself a pnpm workspace, where the dependency can be declared in any workspace member and never at the root at all). `update` never adds a dependency nowhere already declared, which is what makes it safe to run unconditionally across every workspace member rather than needing to know in advance which one, if any, declares the package.
#
# Neither job's setup-node step requests `cache: pnpm`: both jobs guard the actual `pnpm add`/`pnpm update` call behind an early exit (nothing to bump, or -- in discover-stranded-prs -- no stranded PR found at all, the common case on every ordinary push to main), so the pnpm store is frequently never populated. `actions/setup-node`'s pnpm cache resolves its save path from `pnpm store path` at setup time, before that store directory has necessarily been created by an actual install -- requesting the cache then fails the job's post-step with a path-validation error on every run that takes an early-exit branch, which is most of them for discover-stranded-prs specifically.
#
# Healing stranded PRs used to be one job that regenerated a branch and then waited out its full CI cycle before moving to the next candidate. Confirmed directly against novus-power/hive: once more than a couple of sibling-update PRs went stranded in the same window (a burst of same-day releases from one sibling package left several open at once), that per-PR CI wait routinely consumed the whole job's timeout budget on the first one or two candidates, and the run was cancelled before ever reaching the rest -- starving whichever PRs happened to sort later in the candidate list, which were consistently the oldest, most overdue ones, never the newest. Split into discover-stranded-prs (fast git operations only -- rebase or regenerate a branch, never wait on CI -- processing candidates oldest-first so the longest-stranded ones are handled first if the job is ever cut short) and wait-and-merge-healed-prs (one job per healed branch via a matrix strategy, so however many PRs got healed wait out their CI cycles in parallel rather than queued one behind another).

on:
  workflow_call:
    inputs:
      app-id:
        description: "GitHub App ID to authenticate as for the branch push, PR, and merge."
        type: string
        default: "4473709"
      workspace:
        description: "Set true when the caller repo is itself a pnpm workspace, so the bump runs recursively across every member package.json instead of assuming a single root package.json."
        type: boolean
        default: false
    secrets:
      app-private-key:
        description: "Private key for the App named by app-id, for a caller whose own secret isn't named AUTOMERGE_APP_PRIVATE_KEY. Optional -- a caller can keep resolving AUTOMERGE_APP_PRIVATE_KEY via secrets: inherit unchanged."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-and-open-pr:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Scoped per package (concurrency groups are already implicitly scoped per repository by GitHub, so this never collides across caller repos): several releases of the same sibling package publishing within seconds of each other each fire their own repository_dispatch event, and without this, GitHub runs one bump-and-open-pr job per event fully in parallel. The "close any other open sibling-update/<package>-* PR before opening this one" step later in this job reads a live snapshot of currently-open PRs -- under real concurrency, every run in the burst takes that snapshot before any of the others have created their own PR, so none of them see anything to close and all survive side by side, exactly the symptom the close-then-create step exists to prevent. Confirmed directly against novus-power/hive: a burst of pdf-codec releases fired nine repository_dispatch-triggered runs within 8 seconds of each other, and all nine PRs survived. GitHub's concurrency queueing doesn't fully serialize the burst either, though: only one run per group may be queued behind the currently in-progress one at a time, and each new arrival replaces (cancels) whatever was queued before it -- cancel-in-progress: false only protects the run actually executing, never a merely-queued one. So a same-package burst collapses to at most two real executions (whichever run was already in-progress when the burst started, and whichever was last-queued once that one finishes), not N sequential ones -- which is what we actually want here: every run in between would have opened, then immediately closed, its own now-superseded PR for nothing. Either way, the run that does execute always has an up-to-date snapshot of what the previous surviving run actually created, restoring the close-then-create step's own invariant.
    concurrency:
      group: sibling-update-bump-${{ github.event.client_payload.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # actions/checkout defaults persist-credentials to true, which writes the default GITHUB_TOKEN into a git http.extraheader entry that takes precedence over the URL-embedded App token this workflow sets later (git remote set-url origin "https://x-access-token:${GH_TOKEN}@...") -- without this, every `git push` below silently authenticates as github-actions[bot], not the App, contradicting this file's own header comment and breaking in any caller repo with push restrictions scoped to the App's bypass identity.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Bump the released dependency, unless main already holds it or newer
        env:
          PACKAGE: ${{ github.event.client_payload.package }}
          VERSION: ${{ github.event.client_payload.version }}
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          # Idempotence guard, checked before the add: the checkout is the default branch, so main's current spec for the package is the floor, and a named version at or below it is a no-op -- equal is a replay of an already-merged bump, below is a backport published after a newer release -- because re-running pnpm add in either case still produces a diff, and the PR that diff opens sails through the wait-for-green gate as a downgrade. Compared on the bare version (range caret stripped), the spec form pnpm add itself writes; dependencies merges last so a dual-table pin resolves to the spec pnpm add will actually rewrite. A caller with no declared dependency on the package at all -- floor empty -- is nothing to bump, not an add: see the workspace input's own doc comment above.
          #
          # Non-workspace callers read the single root package.json. A workspace caller has no single file to read -- the dependency can live in any member -- so the floor is the minimum version found across every package.json in the tree that declares it at all; an empty floor there means no member currently depends on it.
          if [ "$WORKSPACE" = "true" ]; then
            floor=""
            while IFS= read -r -d '' pkgjson; do
              v=$(jq -r --arg p "$PACKAGE" '(.devDependencies // {}) * (.optionalDependencies // {}) * (.peerDependencies // {}) * (.dependencies // {}) | .[$p] // empty' "$pkgjson" | tr -d '^~')
              if [ -n "$v" ] && { [ -z "$floor" ] || [ "$v" = "$(printf '%s\n%s\n' "$v" "$floor" | sort -V | head -n1)" ]; }; then
                floor="$v"
              fi
            done < <(find . -name package.json -not -path '*/node_modules/*' -print0)
          else
            floor=$(jq -r --arg p "$PACKAGE" '(.devDependencies // {}) * (.optionalDependencies // {}) * (.peerDependencies // {}) * (.dependencies // {}) | .[$p] // empty' package.json | tr -d '^~')
          fi
          if [ -z "$floor" ]; then
            echo "main does not currently depend on ${PACKAGE} -- nothing to bump."
            exit 0
          fi
          if [ "$VERSION" = "$(printf '%s\n%s\n' "$floor" "$VERSION" | sort -V | head -n1)" ]; then
            echo "main already holds ${PACKAGE}@${floor} -- ${VERSION} is at or below it. Nothing to bump."
            exit 0
          fi
          if [ "$WORKSPACE" = "true" ]; then
            pnpm update "$PACKAGE@$VERSION" --recursive
          else
            pnpm add "$PACKAGE@$VERSION"
          fi
      - name: Check whether anything actually changed
        id: diff
        run: |
          # '**/package.json' covers a workspace member's own package.json (and, via git's zero-directories glob match, the root one too, alongside the explicit 'package.json' term below) -- pnpm add/update never touch anything outside these two filenames, in either mode.
          if git diff --quiet -- package.json '**/package.json' pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate a token for the branch push and PR
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          # actionlint flags secrets.AUTOMERGE_APP_PRIVATE_KEY here as undefined, since it isn't declared under workflow_call.secrets above -- a false positive: GitHub's own reusable-workflow docs confirm a secret inherited via `secrets: inherit` at the call site stays referenceable by its original name even when not declared, which a caller relying on it depends on for exactly this secret.
          private-key: ${{ secrets.app-private-key || secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Commit and open a PR
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE: ${{ github.event.client_payload.package }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          branch="sibling-update/${PACKAGE}-${VERSION}"

          # A burst of releases from the same sibling package (several patch versions publishing in quick succession, each firing its own repository_dispatch) previously left one open PR per version sitting side by side forever -- nothing here ever closed an older one once a newer release superseded it. Any other open sibling-update/<PACKAGE>-* PR at this point can only be for a strictly older version of this exact package: the idempotence guard above already exited early for a dispatched version at or below what main currently holds, so an open PR here was itself opened for something between that floor and this new version. Close it and delete its branch before opening the new one, mirroring heal-stranded-prs' own regenerate_pr close-then-recreate pattern below.
          # shellcheck disable=SC2016 # $pkg in the --jq program below is a jq variable bound by --arg, not a shell one -- single-quoting the jq program is correct, not a mistake.
          while IFS=$'\t' read -r stale_number stale_branch; do
            [ -z "$stale_number" ] && continue
            gh pr close "$stale_number" --comment "Superseded by a newer ${PACKAGE} release -- this dispatch bumps to ${VERSION}." || true
            git push origin --delete "$stale_branch" || echo "::warning::could not delete superseded branch ${stale_branch}"
          done < <(gh pr list --state open --json number,headRefName --jq --arg pkg "$PACKAGE" '.[] | select(.headRefName | startswith("sibling-update/\($pkg)-")) | [(.number | tostring), .headRefName] | @tsv')

          git checkout -b "$branch"
          git add -u
          body=$(printf 'Triggered instantly via repository_dispatch when %s published its own release,\nrather than waiting for the next scheduled Dependabot scan.' "$PACKAGE")
          git commit -m "build(deps): bump ${PACKAGE} to ${VERSION}" -m "$body"
          git push origin "$branch"
          pr_url=$(gh pr create --title "build(deps): bump ${PACKAGE} to ${VERSION}" --body "Automatic dependency bump triggered instantly by the ${PACKAGE} release." --base main --head "$branch")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for a check-run to register against the new commit
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          head_sha="${{ steps.pr.outputs.head_sha }}"
          repo="${{ github.repository }}"
          # Any check-run, not one named a specific literal: the guard this step exists for (see this file's own header comment) is "at least one check-run has appeared against the head commit", not "a check-run of a particular name has". Filtering on a hardcoded name silently degrades this to a no-op for any caller whose CI doesn't happen to have a job with that exact name -- e.g. novus-power/hive's own CI has no check named exactly "Test" at all ("Test (unit)", "Test (integration)", etc.), so a name filter here would never once succeed against its real PRs.
          for _attempt in $(seq 1 30); do
            found=$(gh api "repos/${repo}/commits/${head_sha}/check-runs" --jq '.check_runs | length')
            if [ "$found" -gt 0 ]; then
              echo "A check-run has registered."
              exit 0
            fi
            sleep 3
          done
          echo "::warning::No check-run registered within 90 seconds. Proceeding to poll anyway -- the polling loop below still treats an empty check-run list as nothing-pending, so this is a best-effort guard, not a hard requirement."
      - name: Wait for all CI checks to pass, then rebase-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_url="${{ steps.pr.outputs.pr_url }}"
          head_sha="${{ steps.pr.outputs.head_sha }}"
          repo="${{ github.repository }}"
          for _attempt in $(seq 1 90); do
            pending=$(gh api "repos/${repo}/commits/${head_sha}/check-runs" --paginate --jq '[.check_runs[] | select(.conclusion == null)] | length')
            if [ "$pending" -eq 0 ]; then
              echo "Every check-run has concluded. Attempting a rebase-merge -- see this file's own header comment for why this doesn't pre-judge every check-run's own conclusion first."
              if gh pr merge --rebase "$pr_url"; then
                exit 0
              fi
              echo "::error::Rebase-merge was rejected -- a genuinely required check failed, or the PR is not otherwise mergeable. Leaving it open for manual review."
              exit 1
            fi
            echo "Waiting for ${pending} CI check(s) to complete..."
            sleep 20
          done
          echo "::warning::CI did not complete within 30 minutes. PR left open for manual merge." >&2

  discover-stranded-prs:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Fast git operations only, never a CI wait (that's wait-and-merge-healed-prs below) -- 20 minutes is headroom for a full backlog of stranded PRs each paying a cold `pnpm add`/`update` install (tens of seconds apiece, observed directly), not a budget for any of them to actually finish CI.
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.regenerate.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See the same option's own comment in bump-and-open-pr above -- identical reasoning, this job also pushes/force-pushes with a minted App token.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          # See the same fallback's own comment in bump-and-open-pr above -- the actionlint "undefined" warning here is the identical false positive.
          private-key: ${{ secrets.app-private-key || secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Rebase or regenerate every stranded sibling-update PR branch
        id: regenerate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # One PR's failure must never abort the rest of the batch -- this whole body previously ran under bash's default errexit (set -e, GitHub Actions' default for `run:` steps), so a single `gh pr create` failure (e.g. "a pull request for branch ... already exists", a genuine race against a concurrent dispatch or another discover-stranded-prs run touching the same branch) killed the entire step immediately, silently abandoning every other stranded PR still queued in this run. regenerate_pr is called inside an `if`, which suppresses errexit for that call, so a nonzero return here only ends this one PR's processing, not the loop.
          #
          # Every healed branch (rebased or regenerated) is recorded here rather than merged inline -- wait-and-merge-healed-prs picks each one up as its own parallel matrix job. Declared before regenerate_pr so the function (a plain shell function, sharing this script's global scope) can append to it directly.
          matrix_entries=()

          regenerate_pr() {
            local number="$1" branch="$2"

            local mergeable="UNKNOWN" merge_state="unknown"
            for _attempt in $(seq 1 10); do
              mergeable=$(gh pr view "$number" --json mergeable --jq '.mergeable')
              merge_state=$(gh pr view "$number" --json mergeStateStatus --jq '.mergeStateStatus')
              if [ "$mergeable" != "UNKNOWN" ]; then
                break
              fi
              sleep 3
            done

            # A PR whose branch is merely behind main (no real conflict -- required-status-checks' own "strict" mode just needs a fresh commit re-tested against the current base) never becomes CONFLICTING and so was previously invisible to this job entirely, left to sit open indefinitely with nothing watching it once the bump-and-open-pr run that created it already exited. A plain branch update (no close/regenerate) is enough here -- the content is already correct, it just needs re-validating against the new base.
            if [ "$mergeable" = "MERGEABLE" ] && [ "$merge_state" = "BEHIND" ]; then
              echo "PR #${number} (${branch}) is mergeable but behind main -- rebasing the branch onto main instead of regenerating."
              # GitHub's own update-branch REST endpoint (what used to run here) only ever performs a MERGE update -- it has no rebase mode -- so it left a real merge commit on the PR branch. That silently broke every later merge attempt on a repo requiring linear history: hive's own required_linear_history ruleset, and its Staged-file guard, both reject a PR containing a merge commit outright -- confirmed directly against novus-power/hive#1600, which accumulated two such merge commits from repeated update-branch calls during a single day's release burst and could no longer be rebase-merged at all. A real local rebase, replaying this branch's own commit(s) onto the fetched main, keeps history linear the way bump-and-open-pr's own fresh branches already are by construction.
              git fetch origin main "$branch"
              git checkout -B "$branch" "origin/${branch}"
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::warning::rebase of ${branch} onto main failed unexpectedly despite GitHub reporting it MERGEABLE -- leaving PR #${number} open for manual resolution."
                return 0
              fi
              git push --force origin "$branch"
              local pr_url head_sha
              pr_url=$(gh pr view "$number" --json url --jq '.url')
              head_sha=$(git rev-parse "$branch")
              matrix_entries+=("$(jq -n -c --arg pr "$pr_url" --arg sha "$head_sha" --arg branch "$branch" '{pr_url:$pr, head_sha:$sha, branch:$branch}')")
              return 0
            fi

            if [ "$mergeable" != "CONFLICTING" ]; then
              echo "PR #${number} (${branch}) is ${mergeable}/${merge_state}, not stranded -- skipping."
              return 0
            fi

            local package_version="${branch#sibling-update/}"
            local package="${package_version%-*}"
            local version="${package_version##*-}"
            echo "Regenerating stranded PR #${number} (${branch}) for ${package}@${version}"

            gh pr close "$number" --comment "Regenerating -- this branch fell behind main and could no longer auto-merge." || true

            git fetch origin main
            git checkout -B "$branch" origin/main

            # Idempotence guard, checked before the add: this checkout is fresh main, so main's current spec for the package is the floor, and a named version at or below it means the just-closed PR is obsolete -- equal is an already-merged bump replaying, below is a stale branch meeting a main that has since moved on (a coordinated migration landing a newer version of the same package). The branch is deleted as well as the PR left closed: closed PRs are invisible to this job's candidate list, but a concurrently-running iteration that already captured the PR can still force-push the branch and reopen from it -- deletion removes that resurrection path entirely. An empty floor (no member depends on the package at all, in workspace mode) is treated the same as stale -- see the workflow_call workspace input's own doc comment for why.
            local floor=""
            if [ "$WORKSPACE" = "true" ]; then
              while IFS= read -r -d '' pkgjson; do
                local v
                v=$(jq -r --arg p "$package" '(.devDependencies // {}) * (.optionalDependencies // {}) * (.peerDependencies // {}) * (.dependencies // {}) | .[$p] // empty' "$pkgjson" | tr -d '^~')
                if [ -n "$v" ] && { [ -z "$floor" ] || [ "$v" = "$(printf '%s\n%s\n' "$v" "$floor" | sort -V | head -n1)" ]; }; then
                  floor="$v"
                fi
              done < <(find . -name package.json -not -path '*/node_modules/*' -print0)
            else
              floor=$(jq -r --arg p "$package" '(.devDependencies // {}) * (.optionalDependencies // {}) * (.peerDependencies // {}) * (.dependencies // {}) | .[$p] // empty' package.json | tr -d '^~')
            fi
            if [ -z "$floor" ] || [ "$version" = "$(printf '%s\n%s\n' "$floor" "$version" | sort -V | head -n1)" ]; then
              echo "main does not depend on ${package}, or already holds it at ${floor:-no version} -- ${version} is stale. PR stays closed."
              git push origin --delete "$branch" || echo "::warning::could not delete stale branch ${branch} on origin"
              return 0
            fi

            if [ "$WORKSPACE" = "true" ]; then
              pnpm update "${package}@${version}" --recursive
            else
              pnpm add "${package}@${version}"
            fi

            # Backstop for floors the ordering guard cannot see: with that guard in place, a no-diff add means the lookup missed main's spec for this package (a dependency table or range form it does not read), not that the bump is stale.
            if git diff --quiet -- package.json '**/package.json' pnpm-lock.yaml; then
              echo "add produced no diff -- main's spec for ${package} was not recognised by the floor lookup. Nothing left to bump."
              git push origin --delete "$branch" || echo "::warning::could not delete stale branch ${branch} on origin"
              return 0
            fi

            git add -u
            git commit -m "build(deps): bump ${package} to ${version}"
            git push --force origin "$branch"

            local pr_url
            if ! pr_url=$(gh pr create --title "build(deps): bump ${package} to ${version}" \
              --body "Regenerated automatically after the original PR fell behind main." \
              --base main --head "$branch" 2>&1); then
              # A PR for this exact branch can already exist if a concurrent dispatch (a fresh publish, or another discover-stranded-prs run) recreated it between this loop reading its candidate list and this iteration reaching gh pr create. The push above already landed on the branch either way, so reuse whatever PR now points at it instead of treating this as fatal.
              local existing
              existing=$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')
              if [ -z "$existing" ]; then
                echo "::warning::gh pr create failed for ${branch} and no existing open PR was found: ${pr_url}"
                return 1
              fi
              echo "PR for ${branch} already exists -- reusing ${existing} instead of creating a new one."
              pr_url="$existing"
            fi

            local head_sha
            head_sha=$(git rev-parse HEAD)
            matrix_entries+=("$(jq -n -c --arg pr "$pr_url" --arg sha "$head_sha" --arg branch "$branch" '{pr_url:$pr, head_sha:$sha, branch:$branch}')")
          }

          # Oldest-created first: whichever candidates this run doesn't get to (the loop itself is fast, but a full pnpm install per regenerated branch still adds up across a large backlog) are the newest ones, which have had the least time to matter -- never the longest-stranded PR, which is exactly the one a future run must not keep losing to newer arrivals.
          candidates=$(gh pr list --state open --json number,headRefName,createdAt \
            --jq '[.[] | select(.headRefName | startswith("sibling-update/"))] | sort_by(.createdAt) | .[]')
          if [ -n "$candidates" ]; then
            while IFS= read -r entry; do
              number=$(echo "$entry" | jq -r '.number')
              branch=$(echo "$entry" | jq -r '.headRefName')
              if ! regenerate_pr "$number" "$branch"; then
                echo "::warning::Failed to regenerate PR #${number} (${branch}) -- continuing with the rest of the batch."
              fi
            done < <(echo "$candidates" | jq -c '.')
          else
            echo "No open sibling-update PRs found."
          fi

          matrix_json=$(printf '%s\n' "${matrix_entries[@]}" | jq -s -c '.')
          echo "$(echo "$matrix_json" | jq 'length') branch(es) healed and awaiting a CI wait + merge."
          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  wait-and-merge-healed-prs:
    needs: discover-stranded-prs
    if: needs.discover-stranded-prs.outputs.matrix != '[]' && needs.discover-stranded-prs.outputs.matrix != ''
    runs-on: ubuntu-latest
    # 30 minutes of polling (below) plus setup headroom -- matches bump-and-open-pr's own single-PR merge job, now run once per healed branch instead of serialised behind every other candidate in discover-stranded-prs.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover-stranded-prs.outputs.matrix) }}
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ inputs.app-id }}
          # See the same fallback's own comment in bump-and-open-pr above -- the actionlint "undefined" warning here is the identical false positive.
          private-key: ${{ secrets.app-private-key || secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Wait for CI on ${{ matrix.branch }}, then rebase-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Bound through env, never spliced straight into the script below: discover-stranded-prs' matrix.branch traces back to a PR's own headRefName, which git accepts containing shell metacharacters -- a `${{ matrix.branch }}` interpolated directly into `run:` would splice that text into the script before bash ever parses it, letting a crafted branch name execute arbitrary commands with this job's write-capable App token. An env entry passes the value as data, not script text.
          PR_URL: ${{ matrix.pr_url }}
          HEAD_SHA: ${{ matrix.head_sha }}
          BRANCH: ${{ matrix.branch }}
        run: |
          pr_url="$PR_URL"
          head_sha="$HEAD_SHA"
          branch="$BRANCH"

          # Any check-run, not one named a specific literal -- see the same guard's own comment in bump-and-open-pr above.
          for _attempt in $(seq 1 30); do
            found=$(gh api "repos/${{ github.repository }}/commits/${head_sha}/check-runs" --jq '.check_runs | length')
            if [ "$found" -gt 0 ]; then
              break
            fi
            sleep 3
          done

          for _poll in $(seq 1 90); do
            pending=$(gh api "repos/${{ github.repository }}/commits/${head_sha}/check-runs" --paginate --jq '[.check_runs[] | select(.conclusion == null)] | length')
            if [ "$pending" -eq 0 ]; then
              # See this file's own header comment: the merge attempt itself, not an enumeration of every check-run's conclusion, is what decides mergeability -- GitHub's required-status-checks list is the actual authority, and a non-required check-run failing here (a review bot, say) must never strand the PR the way it used to.
              gh pr merge --rebase "$pr_url" || echo "::warning::merge of ${pr_url} failed -- leaving it open for the next discover-stranded-prs run to retry"
              exit 0
            fi
            echo "Waiting for ${pending} CI check(s) to complete on ${branch}..."
            sleep 20
          done
          echo "::warning::CI did not complete within 30 minutes for ${branch}. PR left open for manual merge or a later retry."
